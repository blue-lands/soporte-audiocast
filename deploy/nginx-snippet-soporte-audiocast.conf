# Soporte Audiocast (/var/www/soporte-audiocast, servicio soporte-audiocast en 127.0.0.1:8392).
# Lo incluye el sitio central.mediaflow.cl. Publicado el 2026-09-28 con el OK de hrm.
# nginx quita el prefijo: /soporte/casos/x llega a la app como /casos/x; la app lo vuelve a poner en lo que responde.

location = /soporte {
    absolute_redirect off;
    return 301 /soporte/;
}

# Solo para curl desde el servidor.
location = /soporte/salud {
    return 404;
}

location /soporte/ {
    proxy_pass http://127.0.0.1:8392/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Los webhooks de ElevenLabs traen la transcripción completa; nada más grande entra aquí.
    client_max_body_size 2m;
    # Las URLs llevan identificadores de conversaciones: no se guardan.
    access_log off;
}
